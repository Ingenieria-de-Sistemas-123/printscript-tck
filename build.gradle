plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = "GitHubPackages"
        url = uri("https://maven.pkg.github.com/Ingenieria-de-Sistemas-123/PrintScript")
        credentials {
            username = findProperty("gpr.user") ?: System.getenv("GITHUB_ACTOR")
            password = findProperty("gpr.key")  ?: System.getenv("GITHUB_TOKEN")
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    minHeapSize = "5m" // initial heap size
    maxHeapSize = "7m" // maximum heap size
}

dependencies {
    testImplementation 'junit:junit:4.13.1'
    implementation 'org.printscript:cli:1.3-SNAPSHOT'
    implementation 'org.printscript:common:1.2-SNAPSHOT'
    implementation 'org.printscript:formatter:1.8-SNAPSHOT'
    implementation 'org.printscript:interpreter:2.1-SNAPSHOT'
    implementation 'org.printscript:lexer:1.6-SNAPSHOT'
    implementation 'org.printscript:linter:1.6-SNAPSHOT'
    implementation 'org.printscript:parser:1.5-SNAPSHOT'
    implementation 'org.printscript:token:1.2-SNAPSHOT'
    implementation 'org.printscript:runner:1.6-SNAPSHOT'
}

test {
    environment "BEST_FOOTBALL_CLUB", "San Lorenzo" //River es mejor
    useJUnit()
}
